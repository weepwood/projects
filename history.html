<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="查看每日汇总和状态变化历史。"><meta name="color-scheme" content="light dark"><title>历史状态 · weepwood Projects</title><style>:root{color-scheme:light;--bg:#f6f8fa;--card:#fff;--line:#d8dee4;--text:#1f2328;--muted:#656d76;--blue:#0969da;--green:#1a7f37;--yellow:#9a6700;--red:#cf222e}:root[data-theme=dark]{color-scheme:dark;--bg:#0d1117;--card:#161b22;--line:#30363d;--text:#f0f6fc;--muted:#8b949e;--blue:#58a6ff;--green:#3fb950;--yellow:#d29922;--red:#f85149}@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#0d1117;--card:#161b22;--line:#30363d;--text:#f0f6fc;--muted:#8b949e;--blue:#58a6ff;--green:#3fb950;--yellow:#d29922;--red:#f85149}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;line-height:1.5}.wrap{width:min(1200px,100%);margin:auto;padding:34px 18px 60px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:28px}h1{font-size:clamp(30px,5vw,50px);letter-spacing:-.05em;margin:0}.sub,.muted{color:var(--muted)}.nav,.actions,.tags,.meta{display:flex;gap:8px;flex-wrap:wrap}.nav a,.theme,.button,.control{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:9px 12px;text-decoration:none;font:inherit}.nav a.active,.button.primary{background:var(--blue);border-color:var(--blue);color:#fff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0 28px}.stat,.card{border:1px solid var(--line);background:var(--card);border-radius:16px;overflow:hidden}.stat{padding:16px}.stat strong{display:block;font-size:25px}.stat span{font-size:13px;color:var(--muted)}.controls{display:grid;grid-template-columns:2fr repeat(3,1fr) auto;gap:10px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:14px;margin-top:16px}.card{display:flex;flex-direction:column}.cover,.fallback{height:150px;width:100%;object-fit:cover}.fallback{display:grid;place-items:center;background:linear-gradient(145deg,rgba(9,105,218,.15),var(--card));font-size:38px;font-weight:800;color:var(--blue)}.body{padding:15px;display:flex;flex-direction:column;flex:1}.head{display:flex;justify-content:space-between;gap:8px}.head h2{font-size:17px;margin:0}.badge,.tag{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:3px 8px}.desc{color:var(--muted);font-size:13px;min-height:58px}.tags{margin-top:auto}.meta{font-size:11px;color:var(--muted);margin-top:12px}.status:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;background:#8c959f}.status.online:before,.status.recovered:before{background:var(--green)}.status.unstable:before,.status.degraded:before{background:var(--yellow)}.status.offline:before{background:var(--red)}table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line)}th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted)}.section{margin-top:28px}footer{text-align:center;color:var(--muted);font-size:12px;margin-top:42px}@media(max-width:760px){.top{flex-direction:column}.stats{grid-template-columns:1fr 1fr}.controls{grid-template-columns:1fr 1fr}.controls input{grid-column:1/-1}table{display:block;overflow:auto}}@media(max-width:500px){.controls{grid-template-columns:1fr}.controls input{grid-column:auto}}.intro,.feature{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(24px,5vw,64px)}.intro{border-top:5px solid #75845e;margin-bottom:32px}.intro h2{font-size:clamp(38px,7vw,76px);margin:.22em 0;line-height:1.1}.intro p,.feature p{max-width:44em;color:var(--muted)}.intro .button{display:inline-block;margin-top:12px}.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}.feature{padding:30px}.feature h3{font-size:32px;margin:18px 0 0}.feature h3 a{color:var(--text);text-decoration:none}.feature a{color:var(--blue)}.case-cover{display:block;width:min(100%,640px);margin:1em 0}small{letter-spacing:.12em}</style><link rel="stylesheet" href="assets/studio.css"></head><body><div class="wrap"><header class="top"><a class="brand" href="index.html"><b>W</b> weepwood<span>/</span><small>项目档案</small></a><nav class="nav"><a class="" href="index.html">作品集</a><a class="" href="catalog.html">项目目录</a><a class="" href="status.html">当前状态</a><a class="active" href="history.html">历史状态</a><button aria-label="切换明暗主题" id="theme" class="theme">◐</button></nav></header><main><h1>历史状态</h1><p class="muted">查看每日汇总和状态变化历史。</p><section class="section"><h2>每日汇总</h2><p class="muted">保留最近 180 天。</p><table><thead><tr><th>日期</th><th>监控</th><th>正常</th><th>警告</th><th>离线</th><th>不监控</th></tr></thead><tbody><tr><td colspan="6">暂无数据</td></tr></tbody></table></section><section class="section"><h2>状态变化事件</h2><p class="muted">仅在状态变化时记录，最多 1000 条。</p><table><thead><tr><th>时间</th><th>项目</th><th>变化</th><th>详情</th></tr></thead><tbody><tr><td colspan="4">尚无状态变化</td></tr></tbody></table></section></main><footer>WEEPWOOD　/　PROJECT ARCHIVE　 ·　 2026-11-20</footer></div><script>const t=document.getElementById("theme");function theme(v){if(v)document.documentElement.dataset.theme=v;else delete document.documentElement.dataset.theme}t.onclick=()=>{const d=document.documentElement.dataset.theme==="dark"||(!document.documentElement.dataset.theme&&matchMedia("(prefers-color-scheme: dark)").matches),n=d?"light":"dark";localStorage.setItem("theme",n);theme(n)};theme(localStorage.getItem("theme"));</script></body></html>
