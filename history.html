-fill,minmax(min(100%,280px),1fr));gap:14px;margin-top:16px}.card{display:flex;flex-direction:column}.cover,.fallback{height:150px;width:100%;object-fit:cover}.fallback{display:grid;place-items:center;background:linear-gradient(145deg,rgba(9,105,218,.15),var(--card));font-size:38px;font-weight:800;color:var(--blue)}.body{padding:15px;display:flex;flex-direction:column;flex:1}.head{display:flex;justify-content:space-between;gap:8px}.head h2{font-size:17px;margin:0}.badge,.tag{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:3px 8px}.desc{color:var(--muted);font-size:13px;min-height:58px}.tags{margin-top:auto}.meta{font-size:11px;color:var(--muted);margin-top:12px}.status:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;background:#8c959f}.status.online:before,.status.recovered:before{background:var(--green)}.status.unstable:before,.status.degraded:before{background:var(--yellow)}.status.offline:before{background:var(--red)}table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line)}th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted)}.section{margin-top:28px}footer{text-align:center;color:var(--muted);font-size:12px;margin-top:42px}@media(max-width:760px){.top{flex-direction:column}.stats{grid-template-columns:1fr 1fr}.controls{grid-template-columns:1fr 1fr}.controls input{grid-column:1/-1}table{display:block;overflow:auto}}@media(max-width:500px){.controls{grid-template-columns:1fr}.controls input{grid-column:auto}}</style><link rel="stylesheet" href="assets/studio.css"></head><body><div class="wrap"><header class="top"><a class="brand" href="index.html"><b aria-hidden="true">✳</b> weepwood<span>.</span></a><nav class="nav" aria-label="主导航"><a  href="index.html"><svg aria-hidden="true" focusable="false"
