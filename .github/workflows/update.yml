name: Update and deploy

on:
  schedule:
    - cron: '23 */6 * * *'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'content/**'
      - 'public/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'astro.config.mjs'
      - '.github/workflows/update.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'content/**'
      - 'public/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'astro.config.mjs'
      - '.github/workflows/update.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Cache key is content-derived rather than run-derived: one entry per
      # configuration, refreshed in place, instead of a new forever-saved entry
      # on every scheduled run.
      - name: Restore automation state and screenshots
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache
            public/covers
          key: automation-${{ runner.os }}-${{ hashFiles('automation.config.json', 'content/**', 'package-lock.json') }}
          restore-keys: |
            automation-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Fetch public repositories
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "users/weepwood/repos?per_page=100&sort=updated&type=owner" | jq -s add > repos_raw.json

      - name: Enrich and classify projects
        run: npm run enrich

      - name: Plan screenshots
        id: screenshot-plan
        run: npm run screenshots:plan

      - name: Install Chromium only when screenshots are due
        if: github.event_name != 'pull_request' && steps.screenshot-plan.outputs.count != '0'
        run: npx playwright install --with-deps chromium

      - name: Capture due screenshots
        if: github.event_name != 'pull_request' && steps.screenshot-plan.outputs.count != '0'
        run: npm run screenshots:capture

      - name: Check project health
        run: npm run health

      - name: Synchronize offline issues
        if: github.event_name != 'pull_request'
        run: npm run issues:sync

      - name: Build site
        run: npm run build

      - name: Enforce size budget
        run: npm run check:budget

      - name: Save automation state and screenshots
        if: github.event_name != 'pull_request' && always()
        uses: actions/cache/save@v4
        with:
          path: |
            .cache
            public/covers
          key: automation-${{ runner.os }}-${{ hashFiles('automation.config.json', 'content/**', 'package-lock.json') }}

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
